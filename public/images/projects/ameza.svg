<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <filter id="lightAmShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#F8FAFC" />

  <!-- Top Announcement Bar -->
  <rect x="0" y="0" width="1200" height="32" fill="#F1F5F9" />
  <line x1="0" y1="32" x2="1200" y2="32" stroke="#E2E8F0" stroke-width="1" />
  <text x="600" y="21" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Free Shipping on All Orders Over ₹999 · Powered by ReactJS &amp; Redux State Management
  </text>

  <!-- Header -->
  <rect x="0" y="32" width="1200" height="70" fill="#FFFFFF" />
  <line x1="0" y1="102" x2="1200" y2="102" stroke="#E2E8F0" stroke-width="1" />

  <!-- Brand -->
  <g transform="translate(48, 52)">
    <text x="0" y="26" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" letter-spacing="1">AMEZA</text>
    <circle cx="98" cy="18" r="4" fill="#C2410C" />
  </g>

  <!-- Nav Links -->
  <g transform="translate(200, 72)" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#475569">
    <text x="0" y="0" fill="#0F172A">New Arrivals</text>
    <line x1="0" y1="6" x2="84" y2="6" stroke="#0F172A" stroke-width="2" />
    <text x="120" y="0">Apparel</text>
    <text x="210" y="0">Footwear</text>
    <text x="310" y="0">Accessories</text>
    <text x="430" y="0" fill="#DC2626">Sale</text>
  </g>

  <!-- Right Actions -->
  <g transform="translate(860, 52)">
    <!-- Search Bar -->
    <rect x="0" y="2" width="200" height="36" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="16" y="25" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Search catalogue...</text>

    <!-- Cart Badge (Redux Store Sync) -->
    <rect x="220" y="2" width="90" height="36" rx="6" fill="#0F172A" />
    <text x="250" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Cart (3)</text>
    <circle cx="236" cy="20" r="4" fill="#C2410C" />
  </g>

  <!-- Hero Promotional Banner (Light Linen Theme) -->
  <g transform="translate(48, 120)">
    <rect width="760" height="180" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1" filter="url(#lightAmShadow)" />
    
    <text x="40" y="52" fill="#C2410C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SEASONAL COLLECTION 2026</text>
    <text x="40" y="94" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">Minimal Architecture, Everyday Wear.</text>
    <text x="40" y="122" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Built with reusable React components and client-side Redux cart persistence.</text>

    <rect x="40" y="136" width="134" height="32" rx="4" fill="#0F172A" />
    <text x="107" y="157" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Explore Catalog →</text>
  </g>

  <!-- PRODUCT GRID (Left side: 760px) -->
  <g transform="translate(48, 320)">
    <text x="0" y="20" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Featured Products</text>
    <text x="0" y="38" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">Active Redux State Dispatched on Click</text>

    <!-- Product 1 -->
    <g transform="translate(0, 56)">
      <rect width="240" height="340" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#lightAmShadow)" />
      <!-- Product Image Area -->
      <rect x="12" y="12" width="216" height="190" rx="6" fill="#F1F5F9" />
      <circle cx="120" cy="107" r="42" fill="#E2E8F0" />
      <path d="M100 130 C100 100, 140 100, 140 130 Z" fill="#94A3B8" />
      <text x="24" y="230" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Relaxed Linen Overshirt</text>
      <text x="24" y="248" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Natural Oatmeal · 100% Cotton</text>
      <text x="24" y="278" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">₹2,499</text>
      <rect x="132" y="260" width="96" height="30" rx="4" fill="#0F172A" />
      <text x="180" y="280" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(260, 56)">
      <rect width="240" height="340" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#lightAmShadow)" />
      <rect x="12" y="12" width="216" height="190" rx="6" fill="#F1F5F9" />
      <circle cx="120" cy="107" r="42" fill="#E2E8F0" />
      <path d="M95 135 L120 85 L145 135 Z" fill="#94A3B8" />
      <text x="24" y="230" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Structured Denim Jacket</text>
      <text x="24" y="248" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Indigo Wash · Boxy Fit</text>
      <text x="24" y="278" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">₹3,899</text>
      <rect x="132" y="260" width="96" height="30" rx="4" fill="#0F172A" />
      <text x="180" y="280" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(520, 56)">
      <rect width="240" height="340" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#lightAmShadow)" />
      <rect x="12" y="12" width="216" height="190" rx="6" fill="#F1F5F9" />
      <circle cx="120" cy="107" r="42" fill="#E2E8F0" />
      <rect x="100" y="90" width="40" height="40" rx="4" fill="#94A3B8" />
      <text x="24" y="230" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Minimalist Canvas Tote</text>
      <text x="24" y="248" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Heavyweight Canvas · Sand</text>
      <text x="24" y="278" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">₹1,299</text>
      <rect x="132" y="260" width="96" height="30" rx="4" fill="#0F172A" />
      <text x="180" y="280" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>
    </g>
  </g>

  <!-- LIVE REDUX CART DRAWER (Right side: 330px) -->
  <g transform="translate(830, 120)">
    <rect width="330" height="600" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#lightAmShadow)" />
    
    <!-- Cart Header -->
    <rect x="0" y="0" width="330" height="56" rx="8 8 0 0" fill="#F8FAFC" />
    <line x1="0" y1="56" x2="330" y2="56" stroke="#E2E8F0" stroke-width="1" />
    <text x="20" y="34" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Shopping Cart (3 items)</text>
    <rect x="235" y="16" width="75" height="24" rx="4" fill="#EEF2F6" />
    <text x="272" y="32" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">REDUX STATE</text>

    <!-- Cart Item 1 -->
    <g transform="translate(20, 76)">
      <rect width="56" height="56" rx="6" fill="#F1F5F9" />
      <text x="68" y="20" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Relaxed Linen Overshirt</text>
      <text x="68" y="36" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Size: M · Qty: 1</text>
      <text x="68" y="52" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">₹2,499</text>
      <line x1="0" y1="70" x2="290" y2="70" stroke="#F1F5F9" stroke-width="1" />
    </g>

    <!-- Cart Item 2 -->
    <g transform="translate(20, 166)">
      <rect width="56" height="56" rx="6" fill="#F1F5F9" />
      <text x="68" y="20" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Structured Denim Jacket</text>
      <text x="68" y="36" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Size: L · Qty: 1</text>
      <text x="68" y="52" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">₹3,899</text>
      <line x1="0" y1="70" x2="290" y2="70" stroke="#F1F5F9" stroke-width="1" />
    </g>

    <!-- Cart Item 3 -->
    <g transform="translate(20, 256)">
      <rect width="56" height="56" rx="6" fill="#F1F5F9" />
      <text x="68" y="20" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Minimalist Canvas Tote</text>
      <text x="68" y="36" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Color: Sand · Qty: 1</text>
      <text x="68" y="52" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">₹1,299</text>
      <line x1="0" y1="70" x2="290" y2="70" stroke="#F1F5F9" stroke-width="1" />
    </g>

    <!-- Cart Summary -->
    <g transform="translate(20, 360)">
      <rect width="290" height="210" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="30" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Subtotal</text>
      <text x="274" y="30" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="end">₹7,697</text>

      <text x="16" y="54" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Standard Shipping</text>
      <text x="274" y="54" fill="#15803D" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="end">FREE</text>

      <line x1="16" y1="74" x2="274" y2="74" stroke="#CBD5E1" stroke-width="1" />

      <text x="16" y="98" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Total (INR)</text>
      <text x="274" y="98" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="end">₹7,697</text>

      <rect x="16" y="122" width="258" height="42" rx="4" fill="#0F172A" />
      <text x="145" y="148" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Proceed to Checkout →</text>

      <text x="145" y="188" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Dispatched via Redux Actions</text>
    </g>
  </g>
</svg>
