<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="kkBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="kkShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#F9FAFB" />

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="76" fill="#FFFFFF" />
  <line x1="0" y1="76" x2="1200" y2="76" stroke="#E5E7EB" stroke-width="1" />

  <!-- KiranaKart Logo -->
  <g transform="translate(48, 18)">
    <rect width="40" height="40" rx="8" fill="#10B981" />
    <path d="M12 28 L15 16 L28 16 L26 24 L16 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="18" cy="27" r="2" fill="#FFFFFF" />
    <circle cx="24" cy="27" r="2" fill="#FFFFFF" />
    <text x="50" y="26" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">KiranaKart</text>
    <text x="50" y="39" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Fresh Groceries in 30 Mins</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(360, 18)">
    <rect width="480" height="40" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1" />
    <circle cx="20" cy="20" r="6" fill="none" stroke="#9CA3AF" stroke-width="2" />
    <line x1="24" y1="24" x2="30" y2="30" stroke="#9CA3AF" stroke-width="2" />
    <text x="40" y="25" fill="#6B7280" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Search for fresh vegetables, fruits, dairy, staples...</text>
  </g>

  <!-- Header Right Actions -->
  <g transform="translate(920, 18)">
    <rect x="0" y="0" width="110" height="40" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
    <text x="55" y="25" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">📍 Hyderabad</text>

    <rect x="124" y="0" width="108" height="40" rx="6" fill="#10B981" />
    <text x="178" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Cart (4) · ₹450</text>
  </g>

  <!-- Category Quick Links Bar -->
  <g transform="translate(48, 96)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">
    <!-- Active Pill: All -->
    <rect x="0" y="0" width="70" height="34" rx="17" fill="#10B981" />
    <text x="35" y="21" fill="#FFFFFF" text-anchor="middle">All Items</text>

    <rect x="80" y="0" width="130" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="145" y="21" fill="#374151" text-anchor="middle">🥦 Fresh Vegetables</text>

    <rect x="220" y="0" width="105" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="272" y="21" fill="#374151" text-anchor="middle">🍎 Fresh Fruits</text>

    <rect x="335" y="0" width="115" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="392" y="21" fill="#374151" text-anchor="middle">🥛 Dairy &amp; Eggs</text>

    <rect x="460" y="0" width="125" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="522" y="21" fill="#374151" text-anchor="middle">🌾 Rice &amp; Staples</text>

    <rect x="595" y="0" width="115" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="652" y="21" fill="#374151" text-anchor="middle">🍪 Snacks &amp; Drinks</text>

    <text x="1152" y="22" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">Bootstrap Responsive Grid</text>
  </g>

  <!-- Banner Showcase -->
  <g transform="translate(48, 146)">
    <rect width="1104" height="130" rx="8" fill="url(#kkBanner)" filter="url(#kkShadow)" />
    
    <text x="36" y="44" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">FARM DIRECT TO YOUR DOORSTEP</text>
    <text x="36" y="80" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">Fresh Daily Groceries, Clean Nutrition &amp; Staples</text>
    <text x="36" y="104" fill="#ECFDF5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Built with mobile-first Bootstrap grid and interactive vanilla JavaScript DOM handlers.</text>

    <rect x="940" y="44" width="128" height="42" rx="6" fill="#FFFFFF" />
    <text x="1004" y="70" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Shop Deals →</text>
  </g>

  <!-- PRODUCT GRID: 4 Cards Across (Bootstrap style responsive columns) -->
  <g transform="translate(48, 296)">
    <text x="0" y="20" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Popular Essentials</text>
    <text x="0" y="38" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="11">Interactive Quantity Counters (DOM Manipulation)</text>

    <!-- Product Card 1 -->
    <g transform="translate(0, 56)">
      <rect width="258" height="360" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#kkShadow)" />
      
      <!-- Visual Placeholder Image -->
      <rect x="12" y="12" width="234" height="190" rx="6" fill="#ECFDF5" />
      <circle cx="129" cy="107" r="48" fill="#D1FAE5" />
      <circle cx="115" cy="115" r="22" fill="#EF4444" />
      <circle cx="140" cy="110" r="20" fill="#DC2626" />
      <path d="M125 90 C125 80, 135 80, 135 90 Z" fill="#10B981" />

      <text x="20" y="230" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Farm Fresh Tomatoes</text>
      <text x="20" y="250" fill="#6B7280" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">1 kg · Hydroponic Grade</text>
      
      <text x="20" y="286" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">₹45 <tspan font-size="12" fill="#9CA3AF" text-decoration="line-through">₹60</tspan></text>

      <rect x="146" y="266" width="92" height="32" rx="4" fill="#10B981" />
      <text x="192" y="287" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add to Cart</text>

      <rect x="20" y="318" width="218" height="26" rx="4" fill="#F0FDF4" />
      <text x="129" y="335" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">✓ In Stock · Delivery 30m</text>
    </g>

    <!-- Product Card 2 -->
    <g transform="translate(282, 56)">
      <rect width="258" height="360" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#kkShadow)" />
      
      <rect x="12" y="12" width="234" height="190" rx="6" fill="#FEFCE8" />
      <circle cx="129" cy="107" r="48" fill="#FEF08A" />
      <path d="M100 130 C120 145, 150 135, 160 95 C145 110, 120 120, 100 130 Z" fill="#EAB308" />

      <text x="20" y="230" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Robusta Bananas</text>
      <text x="20" y="250" fill="#6B7280" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">6 pcs (Approx 500g)</text>
      
      <text x="20" y="286" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">₹50 <tspan font-size="12" fill="#9CA3AF" text-decoration="line-through">₹65</tspan></text>

      <!-- Active Quantity Controller (DOM Interaction) -->
      <rect x="146" y="266" width="92" height="32" rx="4" fill="#059669" />
      <text x="160" y="287" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">-</text>
      <text x="192" y="287" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text>
      <text x="224" y="287" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">+</text>

      <rect x="20" y="318" width="218" height="26" rx="4" fill="#FEFCE8" />
      <text x="129" y="335" fill="#A16207" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">✓ Added to Cart (2x)</text>
    </g>

    <!-- Product Card 3 -->
    <g transform="translate(564, 56)">
      <rect width="258" height="360" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#kkShadow)" />
      
      <rect x="12" y="12" width="234" height="190" rx="6" fill="#EFF6FF" />
      <circle cx="129" cy="107" r="48" fill="#DBEAFE" />
      <rect x="110" y="80" width="38" height="60" rx="4" fill="#3B82F6" />
      <rect x="116" y="90" width="26" height="24" rx="2" fill="#FFFFFF" />

      <text x="20" y="230" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Amul Taaza Homogenised Milk</text>
      <text x="20" y="250" fill="#6B7280" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">1 Litre · Toned Milk</text>
      
      <text x="20" y="286" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">₹62</text>

      <rect x="146" y="266" width="92" height="32" rx="4" fill="#10B981" />
      <text x="192" y="287" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add to Cart</text>

      <rect x="20" y="318" width="218" height="26" rx="4" fill="#F0FDF4" />
      <text x="129" y="335" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">✓ In Stock · Chilled</text>
    </g>

    <!-- Product Card 4 -->
    <g transform="translate(846, 56)">
      <rect width="258" height="360" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#kkShadow)" />
      
      <rect x="12" y="12" width="234" height="190" rx="6" fill="#FFF7ED" />
      <circle cx="129" cy="107" r="48" fill="#FFEDD5" />
      <path d="M110 135 L129 80 L148 135 Z" fill="#F97316" />

      <text x="20" y="230" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Aashirvaad Shudh Chakki Atta</text>
      <text x="20" y="250" fill="#6B7280" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">5 kg · 100% Whole Wheat</text>
      
      <text x="20" y="286" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">₹275 <tspan font-size="12" fill="#9CA3AF" text-decoration="line-through">₹310</tspan></text>

      <rect x="146" y="266" width="92" height="32" rx="4" fill="#10B981" />
      <text x="192" y="287" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add to Cart</text>

      <rect x="20" y="318" width="218" height="26" rx="4" fill="#F0FDF4" />
      <text x="129" y="335" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">✓ In Stock · Pantry Staple</text>
    </g>
  </g>
</svg>

