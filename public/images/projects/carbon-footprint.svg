<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="lightLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="lightArea1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="lightCardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#F8FAFC" />

  <!-- Sidebar -->
  <rect x="0" y="0" width="230" height="750" fill="#FFFFFF" />
  <line x1="230" y1="0" x2="230" y2="750" stroke="#E2E8F0" stroke-width="1" />

  <!-- App Brand in Sidebar -->
  <g transform="translate(24, 24)">
    <rect width="36" height="36" rx="8" fill="#059669" />
    <path d="M12 24 C 12 16, 24 12, 24 12 C 24 20, 16 24, 12 24 Z" fill="#FFFFFF" />
    <text x="46" y="24" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Eco-Track AI</text>
    <text x="46" y="38" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">Analytics Platform</text>
  </g>

  <!-- Sidebar Navigation -->
  <g transform="translate(16, 100)">
    <!-- Active Nav Item -->
    <rect x="0" y="0" width="198" height="40" rx="6" fill="#F1F5F9" />
    <line x1="0" y1="6" x2="0" y2="34" stroke="#059669" stroke-width="4" stroke-linecap="round" />
    <circle cx="20" cy="20" r="5" fill="#059669" />
    <text x="36" y="24" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Dashboard</text>

    <!-- Nav Item 2 -->
    <text x="36" y="66" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Emissions Breakdown</text>
    <!-- Nav Item 3 -->
    <text x="36" y="106" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">ML Forecasts</text>
    <!-- Nav Item 4 -->
    <text x="36" y="146" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Facility Reports</text>
    <!-- Nav Item 5 -->
    <text x="36" y="186" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">CSV / PDF Exports</text>
    <!-- Nav Item 6 -->
    <text x="36" y="226" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">System Settings</text>
  </g>

  <!-- Team Lead / User Badge at bottom of sidebar -->
  <g transform="translate(16, 680)">
    <rect width="198" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="24" cy="24" r="14" fill="#059669" />
    <text x="24" y="29" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">AA</text>
    <text x="46" y="21" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Abdul Ameen</text>
    <text x="46" y="34" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Team Lead &amp; Dev</text>
  </g>

  <!-- Main Content Header -->
  <g transform="translate(254, 20)">
    <text x="0" y="28" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">Carbon Emissions Analytics &amp; Predictions</text>
    <text x="0" y="48" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">Django REST API + scikit-learn Predictive Pipeline</text>

    <!-- Top Right Actions -->
    <g transform="translate(680, 8)">
      <rect x="0" y="0" width="110" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="55" y="22" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Export CSV</text>

      <rect x="120" y="0" width="110" height="34" rx="4" fill="#0F172A" />
      <text x="175" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Generate PDF</text>
    </g>
  </g>

  <line x1="254" y1="84" x2="1176" y2="84" stroke="#E2E8F0" stroke-width="1" />

  <!-- 4 Metric Cards -->
  <g transform="translate(254, 100)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="218" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#lightCardShadow)" />
    <text x="16" y="26" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">TOTAL EMISSIONS</text>
    <text x="16" y="58" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">428.4 <tspan font-size="14" fill="#64748B" font-weight="500">tCO2e</tspan></text>
    <rect x="16" y="68" width="66" height="18" rx="4" fill="#DCFCE7" />
    <text x="49" y="81" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">-8.4% YoY</text>

    <!-- Card 2 -->
    <rect x="234" y="0" width="218" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#lightCardShadow)" />
    <text x="250" y="26" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">SCOPE 1 (DIRECT FUEL)</text>
    <text x="250" y="58" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">142.1 <tspan font-size="14" fill="#64748B" font-weight="500">tCO2e</tspan></text>
    <text x="250" y="81" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">Fleet &amp; Generators</text>

    <!-- Card 3 -->
    <rect x="468" y="0" width="218" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#lightCardShadow)" />
    <text x="484" y="26" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">SCOPE 2 (ELECTRICITY)</text>
    <text x="484" y="58" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">198.6 <tspan font-size="14" fill="#64748B" font-weight="500">tCO2e</tspan></text>
    <text x="484" y="81" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Grid Meter Integration</text>

    <!-- Card 4: ML Prediction -->
    <rect x="702" y="0" width="220" height="96" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#lightCardShadow)" />
    <rect x="836" y="12" width="76" height="18" rx="4" fill="#DCFCE7" />
    <text x="874" y="25" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">ML PREDICTION</text>
    <text x="718" y="26" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Q3 TARGET</text>
    <text x="718" y="58" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">386.0 <tspan font-size="14" fill="#15803D" font-weight="500">tCO2e</tspan></text>
    <text x="718" y="81" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">scikit-learn Linear Reg.</text>
  </g>

  <!-- Center Main Section: Left Chart + Right Donut -->
  <g transform="translate(254, 216)">
    <!-- Chart Box -->
    <rect x="0" y="0" width="580" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#lightCardShadow)" />
    <text x="20" y="30" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Monthly Emission Trajectory (2025–2026)</text>
    <text x="20" y="48" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">Actual Emissions vs. ML Predicted Target</text>

    <!-- Chart Grid Lines -->
    <g stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3">
      <line x1="50" y1="80" x2="550" y2="80" />
      <line x1="50" y1="120" x2="550" y2="120" />
      <line x1="50" y1="160" x2="550" y2="160" />
      <line x1="50" y1="200" x2="550" y2="200" />
      <line x1="50" y1="240" x2="550" y2="240" />
    </g>

    <!-- Y-Axis Labels -->
    <g fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">
      <text x="42" y="84">500t</text>
      <text x="42" y="124">400t</text>
      <text x="42" y="164">300t</text>
      <text x="42" y="204">200t</text>
      <text x="42" y="244">100t</text>
    </g>

    <!-- X-Axis Labels -->
    <g fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">
      <text x="80" y="260">Jan</text>
      <text x="140" y="260">Feb</text>
      <text x="200" y="260">Mar</text>
      <text x="260" y="260">Apr</text>
      <text x="320" y="260">May</text>
      <text x="380" y="260">Jun</text>
      <text x="440" y="260">Jul (Est)</text>
      <text x="500" y="260">Aug (Est)</text>
    </g>

    <!-- Area Fill -->
    <path d="M 80 140 L 140 135 L 200 120 L 260 115 L 320 100 L 380 95 L 380 240 L 80 240 Z" fill="url(#lightArea1)" />

    <!-- Actual Emission Line (Green) -->
    <path d="M 80 140 L 140 135 L 200 120 L 260 115 L 320 100 L 380 95" fill="none" stroke="url(#lightLine1)" stroke-width="3" stroke-linecap="round" />
    <circle cx="80" cy="140" r="4" fill="#059669" />
    <circle cx="140" cy="135" r="4" fill="#059669" />
    <circle cx="200" cy="120" r="4" fill="#059669" />
    <circle cx="260" cy="115" r="4" fill="#059669" />
    <circle cx="320" cy="100" r="4" fill="#059669" />
    <circle cx="380" cy="95" r="4" fill="#0284C7" />

    <!-- ML Predicted Line (Dashed Amber) -->
    <path d="M 380 95 L 440 85 L 500 78" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5,5" stroke-linecap="round" />
    <circle cx="440" cy="85" r="4" fill="#D97706" />
    <circle cx="500" cy="78" r="4" fill="#D97706" />

    <!-- Chart Legend -->
    <g transform="translate(370, 18)" font-family="'JetBrains Mono', monospace" font-size="10">
      <rect x="0" y="4" width="12" height="3" fill="#059669" />
      <text x="18" y="9" fill="#475569">Actual</text>
      <line x1="68" y1="5" x2="80" y2="5" stroke="#D97706" stroke-width="2" stroke-dasharray="3,2" />
      <text x="86" y="9" fill="#D97706">ML Model</text>
    </g>

    <!-- Right Side: Category Breakdown -->
    <rect x="600" y="0" width="322" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#lightCardShadow)" />
    <text x="620" y="30" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Category Breakdown</text>
    <text x="620" y="48" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">CO2e proportion by source</text>

    <!-- Donut Ring Representation -->
    <circle cx="760" cy="140" r="62" fill="none" stroke="#F1F5F9" stroke-width="26" />
    <circle cx="760" cy="140" r="62" fill="none" stroke="#059669" stroke-width="26" stroke-dasharray="180 390" stroke-dashoffset="0" />
    <circle cx="760" cy="140" r="62" fill="none" stroke="#0284C7" stroke-width="26" stroke-dasharray="110 390" stroke-dashoffset="-180" />
    <circle cx="760" cy="140" r="62" fill="none" stroke="#D97706" stroke-width="26" stroke-dasharray="65 390" stroke-dashoffset="-290" />
    <circle cx="760" cy="140" r="62" fill="none" stroke="#7C3AED" stroke-width="26" stroke-dasharray="35 390" stroke-dashoffset="-355" />

    <text x="760" y="136" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" text-anchor="middle">100%</text>
    <text x="760" y="152" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">AUDITED</text>

    <!-- Category Legend List -->
    <g transform="translate(620, 232)" font-family="'JetBrains Mono', monospace" font-size="10">
      <circle cx="6" cy="4" r="4" fill="#059669" />
      <text x="16" y="7" fill="#475569">Facilities (46%)</text>

      <circle cx="150" cy="4" r="4" fill="#0284C7" />
      <text x="160" y="7" fill="#475569">Fleet (28%)</text>

      <circle cx="6" cy="24" r="4" fill="#D97706" />
      <text x="16" y="27" fill="#475569">Supply Chain (16%)</text>

      <circle cx="150" cy="24" r="4" fill="#7C3AED" />
      <text x="160" y="27" fill="#475569">Travel (10%)</text>
    </g>
  </g>

  <!-- Bottom Data Table -->
  <g transform="translate(254, 516)">
    <rect x="0" y="0" width="922" height="204" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#lightCardShadow)" />
    <text x="20" y="28" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Recent Emission Sources &amp; Audit Logs</text>

    <!-- Table Header -->
    <rect x="16" y="42" width="890" height="28" rx="4" fill="#F8FAFC" />
    <text x="32" y="60" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">SOURCE NAME</text>
    <text x="280" y="60" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CATEGORY</text>
    <text x="460" y="60" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">RECORDED (CO2e)</text>
    <text x="640" y="60" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">TREND / PREDICTION</text>
    <text x="820" y="60" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">STATUS</text>

    <!-- Table Row 1 -->
    <text x="32" y="96" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Unit 3 Manufacturing Plant</text>
    <text x="280" y="96" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">Scope 1 (Natural Gas)</text>
    <text x="460" y="96" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">68.4 t</text>
    <text x="640" y="96" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">↓ 12% Reduction</text>
    <rect x="820" y="82" width="60" height="20" rx="4" fill="#DCFCE7" />
    <text x="850" y="96" fill="#15803D" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">ACTIVE</text>
    <line x1="20" y1="112" x2="902" y2="112" stroke="#F1F5F9" stroke-width="1" />

    <!-- Table Row 2 -->
    <text x="32" y="136" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Central Logistics Fleet (24 EVs)</text>
    <text x="280" y="136" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">Scope 2 (Charging)</text>
    <text x="460" y="136" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">34.2 t</text>
    <text x="640" y="136" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">→ Stable Grid</text>
    <rect x="820" y="122" width="60" height="20" rx="4" fill="#E0F2FE" />
    <text x="850" y="136" fill="#0369A1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">SYNCED</text>
    <line x1="20" y1="152" x2="902" y2="152" stroke="#F1F5F9" stroke-width="1" />

    <!-- Table Row 3 -->
    <text x="32" y="176" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Regional Data Server Complex</text>
    <text x="280" y="176" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">Scope 2 (HVAC &amp; Servers)</text>
    <text x="460" y="176" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">92.8 t</text>
    <text x="640" y="176" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">↑ 4% Projected</text>
    <rect x="820" y="162" width="60" height="20" rx="4" fill="#FEF3C7" />
    <text x="850" y="176" fill="#B45309" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">AUDITED</text>
  </g>
</svg>
